/* Native interactive replacements for PowerPoint activity screenshots */
.learning-board{width:100%;padding:clamp(10px,1.5vw,22px);border-radius:20px;border:1px solid #cfbea0;background:linear-gradient(135deg,#faf8ed,#e3ede2)}

()=>`<div class="slide soft"><span class="kicker">المواطنة</span><div class="split" style="grid-template-columns:1.15fr .85fr"><div class="list"><h1>الرؤية2030</h1><p>الرؤية هي احد اهم الأسس التي ساعدت على تطور المملكة العربية السعودية منذ ان تم وضع أهدافها</p>${rev(`<p>ومن خلال الرؤية نستطيع تحقيق اقصى درجات المواطنة السعودية  وذلك عن طريق الاهتمام بتاريخ تأسيس الدولة السعودية بمختلف مراحلها ودراسة هذا التاريخ على جميع نواحيه الاجتماعية والاقتصادية والسياسية وتعزيز الولاء لوطننا الغالي من خلال الفخر بهذه الدولة العظيمة</p>`)}${rev(`<div class="question">طبقي هذه العبارة على درسنا لهذا اليوم وهو امارة الدرعية</div>`)}</div>${photo('image32.webp')}</div></div>`
];
const names=['مقدمة العرض','ميثاق الحصة','مفاتيح المعرفة','إمارة الدرعية','جدول التعلم','اضاءة','تفكير','مانع المريدي','مدينة الدرعية','مشاهدة الفيديو','التسلسل التاريخي','المخطط الزمني','التقويم الختامي','درع الوطن','الرؤية2030'];
const qs=['ماذا لو لم يستوطن الاخيضريون منطقة حجر اليمامة ؟','كيف كان تأثير  سياسية الاخيضريون في المنطقة ؟','من المسؤول عن عودة الحياة الى منطقة حجر اليمامة ؟','عندما أسس النبي محمد صلى الله عليه وسلم الدولة الإسلامية كان اول الاعمال التي قام بها هو تأسيس .......................','لماذا انتقل مانع المريدي الى نجد عام 850هـ؟'];
let current=0,revealCount=0,shieldMode='brief',shieldTarget=0,targetsDone=new Set(),soundEnabled=true,shieldOutcome='';const el=document.getElementById('stage'),count=document.getElementById('counter'),progress=document.getElementById('progress');
function play(id){if(!soundEnabled)return;const a=document.getElementById(id);if(!a)return;a.pause();a.currentTime=0;a.play().catch(()=>{});}
function tick(f=650){if(!soundEnabled)return;try{const ctx=tick.ctx||(tick.ctx=new(window.AudioContext||window.webkitAudioContext)());if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(f,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(f*.73,ctx.currentTime+.11);g.gain.setValueAtTime(.035,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.13);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.13)}catch(e){}}
const classworkState=(()=>{try{return JSON.parse(localStorage.getItem('imarat-al-diriyah-classwork-v1')||'{}')}catch(e){return {}}})();
function rememberClasswork(){document.querySelectorAll('[data-note]').forEach(input=>{if(input.dataset.note in classworkState){input.value=classworkState[input.dataset.note]}})}
document.addEventListener('input',e=>{let node=e.target.closest('[data-note]');if(node){classworkState[node.dataset.note]=node.value;try{localStorage.setItem('imarat-al-diriyah-classwork-v1',JSON.stringify(classworkState))}catch(e){}}});
function render(){document.querySelectorAll('video').forEach(v=>v.pause());el.innerHTML=screen[current]();rememberClasswork();el.setAttribute('data-slide',String(current));if(current===13){bindShield()}const reveals=el.querySelectorAll('.reveal');reveals.forEach((r,i)=>{if(i<revealCount)r.classList.add('show')});count.textContent=`${current+1} / ${screen.length} · ${names[current]}`;progress.style.width=`${(current+1)/screen.length*100}%`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===screen.length-1;document.getElementById('hint').textContent=reveals.length>revealCount?'المس الشاشة للظهور التدريجي':' ';}
function revealNext(){const v=el.querySelectorAll('.reveal');if(revealCount<v.length){v[revealCount++].classList.add('show');tick();document.getElementById('hint').textContent=revealCount===v.length?' ':'المس الشاشة للظهور التدريجي';return true}return false}
function nav(dir){if(current===13 && shieldMode==='question' && dir>0)return;if(dir>0&&revealNext())return;current=Math.max(0,Math.min(screen.length-1,current+dir));revealCount=0;render()}
el.addEventListener('click',e=>{if(e.target.closest('button,a,video,dialog,input,textarea,details,summary,[contenteditable]'))return;revealNext()});document.getElementById('next').addEventListener('click',()=>nav(1));document.getElementById('prev').addEventListener('click',()=>nav(-1));document.getElementById('sound').addEventListener('click',()=>{soundEnabled=!soundEnabled;document.getElementById('sound').classList.toggle('active',!soundEnabled);document.getElementById('sound').textContent=soundEnabled?'♫':'⊘';if(!soundEnabled)document.querySelectorAll('audio').forEach(a=>a.pause())});document.getElementById('full').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.getElementById('app').requestFullscreen?.().catch(()=>{})});document.addEventListener('keydown',e=>{if(['ArrowLeft','PageDown'].includes(e.key))nav(1);if(['ArrowRight','PageUp'].includes(e.key))nav(-1);if(e.key===' '&&e.target===document.body){e.preventDefault();revealNext()}});
function shieldAsset(name){return 'assets/'+name}
function renderShield(){let t=`<div class="slide shield"><div class="shieldscene ${shieldMode}"><div class="sky"></div><img class="city" src="${shieldAsset('shield-city.webp')}" alt=""><div class="shieldhud"><span class="shieldbadge">درع الوطن · مهمة الاعتراض الذكي</span><span class="shieldbadge">${targetsDone.size} / 5</span></div>`;
 if(shieldMode==='brief'){t+=`<img class="soldier" src="${shieldAsset('shield-soldier.webp')}" alt=""><div class="shieldpanel"><h2>درع الوطن</h2><p>أبنائي وبناتي…أنتم اليوم في مهمة وطنية خاصة…تم رصد تحركات في سماء المدينة…ونحتاج إلى ذكائكم للتصدي لها<br>هل أنتم مستعدون؟</p><button class="cta alt" data-shield="start">ابدئي المهمة</button></div>`}
 if(shieldMode==='targets'){t+=`<div class="targetsheadline">مهمة الاعتراض الذكي</div>`;const c=['الأول','الثاني','الثالث','الرابع','الخامس'];for(let i=0;i<5;i++){t+=`<button class="target-btn p${i+1} ${targetsDone.has(i)?'done':''}" data-shield="pick" data-target="${i}"><img src="${shieldAsset('shield-aircraft.webp')}" alt=""><b>الهدف ${c[i]}</b></button>`}if(targetsDone.size===5){t+=`<button class="cta alt shield-screen-btn" data-shield="finish">للإنهاء</button>`}}
 if(shieldMode==='question'){t+=`<div class="shieldquestion"><h2>السؤال ${['الأول','الثاني','الثالث','الرابع','الخامس'][shieldTarget]}</h2><p>${qs[shieldTarget]}</p><div class="shieldaction"><button class="cta" data-shield="correct">إجابة صحيحة</button><button class="cta outline" data-shield="wrong">إجابة خاطئة</button></div></div><img id="rocket" class="rocket" src="${shieldAsset('shield-missile.webp')}" alt=""><img id="boom" class="boom" src="${shieldAsset('shield-hit.webp')}" alt="">`;
 if(shieldOutcome){t+=`<div class="shieldoutcome ${shieldOutcome==='good'?'shieldgood':'shieldbad'}"><h2>${shieldOutcome==='good'?'إصابة مباشرة':'الهدف لازال نشطًا'}</h2><p>${shieldOutcome==='good'?'تم اسقاط الهدف بنجاح':'لنحاول مرة أخرى نحن قريبون من الهدف'}</p><button class="cta alt" data-shield="return">${shieldOutcome==='good'?'عودة':'حاولي مرة أخرى'}</button></div>`}}
 if(shieldMode==='finish'){t+=`<div class="shieldpanel" style="left:50%;transform:translate(-50%,-50%);width:min(83%,880px);text-align:center"><h2>المهمة اكتملت بنجاح</h2><p>آداء مميز ☺</p><p>أثبتم أن المعرفة هي خط الدفاع الأول , وكل إجابة صحيحة كانت حماية وكل محاولة كانت خطوة نحو الاتقان , نفخر بكم</p><button class="cta alt" data-shield="reset">إعادة المهمة</button></div>`}
 return t+'</div></div>'}
function bindShield(){el.querySelectorAll('[data-shield]').forEach(b=>b.addEventListener('click',()=>handleShield(b.dataset.shield,Number(b.dataset.target))))}
function updateShield(){el.innerHTML=renderShield();bindShield()}
function handleShield(action,i){if(action==='start'){shieldMode='targets';targetsDone.clear();shieldOutcome='';play('brief-audio');updateShield()}else if(action==='pick'){if(targetsDone.has(i))return;shieldTarget=i;shieldOutcome='';shieldMode='question';tick(340);updateShield()}else if(action==='correct'){if(shieldOutcome)return;shieldOutcome='good';play('hit-audio');const rocket=document.getElementById('rocket');rocket.classList.add('fire');setTimeout(()=>document.getElementById('boom')?.classList.add('hit'),700);setTimeout(()=>{targetsDone.add(shieldTarget);updateShield()},1280)}else if(action==='wrong'){if(shieldOutcome)return;shieldOutcome='bad';play('miss-audio');updateShield()}else if(action==='return'){shieldOutcome='';shieldMode=targetsDone.has(shieldTarget)?'targets':'question';updateShield()}else if(action==='finish'){shieldMode='finish';tick(850);updateShield()}else if(action==='reset'){shieldMode='brief';targetsDone.clear();shieldOutcome='';updateShield()}}
render();
</script></body></html>
