/* Native interactive replacements for PowerPoint activity screenshots */
.learning-board{width:100%;padding:clamp(10px,1.5vw,22px);border-radius:20px;border:1px solid #cfbea0;background:linear-gradient(135deg,#faf8ed,#e3ede2)}

()=>`<div class="slide soft"><span class="kicker">ميثاق الحصة</span><h1>ميثاق الحصة</h1><div class="cards two">${['كون مستعدا واحضر كافة مستلزمات درسك وكتبك','الاحترام المتبادل بينك وبين معلمك وزملائك امرا واجباَ','للإجابة ارفع يدك بهدوء وأجب عن المطلوب بأدب .تفاعلك ونشاطك دليل اهتمامك','وقت الحصة ملك لجميع الطلاب فيجب عليك التواجد داخل الفصل قبل دخول المعلم .','تعاون مع زملائك في المجموعات وداخل الفصل'].map(x=>rev(`<div class="rule">${x}</div>`)).join('')}</div></div>`,

()=>`<div class="slide soft"><span class="kicker">جدول التعلم</span><div class="split"><div><h1>جدول التعلم</h1><p>طلابي الأعزاء من خلال الاطلاع السريع على الدرس</p><p>استخرج اهدافك المراد تحقيقها من دراستنا لهذا الموضوع</p></div><div class="learning-board"><div class="learning-tiles">${[1,2,3].map(i=>rev(`<div class="learning-tile"><span class="learning-dot">${i}</span><div class="learning-space" contenteditable="true" spellcheck="false" role="textbox" aria-label="مساحة كتابة"></div></div>`)).join('')}</div></div></div></div>`,
()=>`<div class="slide soft"><span class="kicker">اضاءة</span><div class="split" style="grid-template-columns:1fr 1.15fr"><div class="list"><div class="box"><h3>عزيزي المتخرج</h3><p>عندما أسس النبي محمد صلى الله عليه وسلم الدولة الإسلامية كان اول الاعمال التي قام بها هو تأسيس .......................</p>${rev(`<h3 class="text-gold">عاصمة الدولة الإسلامية</h3>`)}</div><p class="small">استمع عزيزي الطالب بمشاهدة الفيديو التالي ودون ملاحظاتك وافكارك ومفاهيمك الجديدة لنقوم بمناقشتها سويا ونتبادل المعلومات المفيدة</p></div><div><div class="video-box"><video controls playsinline preload="none" poster="assets/amira_image15.png" src="assets/video1.mp4"></video></div></div></div></div>`,

()=>`<div class="slide soft muraydi-slide"><span class="kicker">مانع المريدي</span><h2>عزيزي الطالب تتبع من خلال الصور الاعمال التي قام بها مانع المريدي</h2><div class="cards muraydi-cards"><div class="box reveal" style="text-align:center">${img('image21.png','image-full')}<h3>مانع المريدي</h3></div><div class="box reveal" style="text-align:center">${img('image24.webp','image-full')}<h3>غصيبة</h3><h3>الميلبيد</h3></div><div class="box reveal" style="text-align:center"><h3>بلدة الدرعية</h3><div class="timeline"><div class="node">1</div><div class="node">2</div><div class="node">3</div></div><h3>امارة ذات نفوذ</h3></div></div></div>`,
()=>`<div class="slide soft city-slide"><div class="city-heading"><div><span class="kicker">مدينة الدرعية</span><h1>مدينة الدرعية</h1></div><div class="city-year"><span>تأسست عام</span><strong>850</strong><span>هجرية</span><strong>1446م</strong></div></div><div class="city-grid">${rev(`<article class="city-item"><h3>تأسست</h3><p>على يد الأمير مانع بن ربيعة المريدي الجد الثاني عشر للملك عبدالعزيز.</p></article>`)}${rev(`<article class="city-item"><h3>تكونت</h3><p>في الأساس من غصيبة والمليبيد.</p></article>`)}${rev(`<article class="city-item"><h3>اتسعت</h3><p>في أحيائها على ضفتي وادي حنيفة.</p></article>`)}${rev(`<article class="city-item"><h3>اعتمدت</h3><p>بطريق الحج لمرور الحجاج من خلالها قادمين من الشرق والشمال الشرقي.</p></article>`)}${rev(`<article class="city-item"><h3>تهيأت</h3><p>لتكون مركزاً للعلم والمعرفة والتنوع الثقافي.</p></article>`)}${rev(`<article class="city-item"><h3>تألفت</h3><p>من مركز حضري به نسبة كبيرة من السكان.</p></article>`)}${rev(`<article class="city-item"><h3>توافرت</h3><p>لها أسباب الحماية وممارسة التجارة وحماية الطرق التجارية وتأمين الاستقرار فيها.</p></article>`)}${rev(`<article class="city-item"><h3>تضمنت</h3><p>منطقة زراعية نظراً لوقوعها على وادي حنيفة الخصب، حيث تقوم بتصدير الفائض عن حاجاتها من الزراعة إلى المدن والمناطق المجاورة.</p></article>`)}</div></div>`,
()=>`<div class="slide soft"><div class="split"><div class="photo" style="height:min(65vh,450px)">${img('image26.png','contain')}</div><div class="video-box"><video controls playsinline preload="none" poster="assets/amira_image26.png" src="assets/video2.mp4"></video></div></div></div>`,
()=>`<div class="slide soft"><div class="split"><div><h1 style="font-size:clamp(22px,2.8vw,40px)">يوضح الفيديو التالي التسلسل التاريخ لحكام الدرعية بدا من مانع المريدي</h1></div><div class="video-box"><video controls playsinline preload="none" poster="assets/amira_image27.png" src="assets/video3.mp4"></video></div></div></div>`,
()=>`<div class="slide soft rulers-slide"><span class="kicker">أبرز أمراء إمارة الدرعية 850 - 1139 هـ</span><h2>أبرز أمراء إمارة الدرعية 850 - 1139 هـ</h2><div class="rulers-grid">${rev(`<div class="ruler-card"><span class="ruler-name">مانع المريدي</span><span class="ruler-desc">أنشأ الدرعية عام 850 هـ وأسس إمارة فيها</span></div>`)}${rev(`<div class="ruler-card"><span class="ruler-name">ربيعة بن مانع</span><span class="ruler-desc">واصل إكمال تأسيس إمارة الدرعية</span></div>`)}${rev(`<div class="ruler-card"><span class="ruler-name">موسى بن ربيعة</span><span class="ruler-desc">زاد من نفوذ الإمارة</span></div>`)}${rev(`<div class="ruler-card"><span class="ruler-name">إبراهيم بن موسى</span><span class="ruler-desc">أمّن طرق الحج والتجارة التي تمر بالدرعية</span></div>`)}${rev(`<div class="ruler-card"><span class="ruler-name">مرخان بن إبراهيم</span><span class="ruler-desc">زاد من نفوذ إمارة الدرعية</span></div>`)}${rev(`<div class="ruler-card"><span class="ruler-name">مقرن بن مرخان</span><span class="ruler-desc">توسعت إمارة الدرعية في عهده وعُرف بالشجاعة</span></div>`)}${rev(`<div class="ruler-card"><span class="ruler-name">سعود بن محمد</span><span class="ruler-desc">زادت قوة إمارة الدرعية في عهده وأصبحت (خيال ابن مقرن) هي نخوة أهل الدرعية مع النخوة الأساس (أهل العوجا)</span></div>`)}${rev(`<div class="ruler-card"><span class="ruler-name">محمد بن سعود</span><span class="ruler-desc">مؤسس الدولة السعودية الأولى</span></div>`)}</div></div>`,
()=>`<div class="slide soft"><span class="kicker">التقويم الختامي</span><div class="split"><div><h1>التقويم الختامي</h1><h2>مهارة طرح الأسئلة</h2><p>اعزائي بالتعاون مع مجموعتك  كون أسئلة متعددة عما تناولناه اليوم في درسنا الممتع  ثم وجهها حسب الاتجاهات السنة</p></div><div class="directions"><div class="directions-title">الأسئلة تكون في ست اتجاهات</div><div class="directions-grid">${rev(`<div class="question-direction">مجموعة تسأل مجموعة</div>`)}${rev(`<div class="question-direction">مجموعة تسأل المعلم</div>`)}${rev(`<div class="question-direction">المعلم يسأل طالبا</div>`)}${rev(`<div class="question-direction">المعلم يسأل مجموعة</div>`)}${rev(`<div class="question-direction">الطالب يسأل طالبا</div>`)}${rev(`<div class="question-direction">الطالب يسأل المعلم</div>`)}</div></div></div></div>`,
()=>renderShield(),
()=>`<div class="slide soft"><span class="kicker">المواطنة</span><div class="split" style="grid-template-columns:1.15fr .85fr"><div class="list"><h1>الرؤية2030</h1><p>الرؤية هي احد اهم الأسس التي ساعدت على تطور المملكة العربية السعودية منذ ان تم وضع أهدافها</p>${rev(`<p>ومن خلال الرؤية نستطيع تحقيق اقصى درجات المواطنة السعودية  وذلك عن طريق الاهتمام بتاريخ تأسيس الدولة السعودية بمختلف مراحلها ودراسة هذا التاريخ على جميع نواحيه الاجتماعية والاقتصادية والسياسية وتعزيز الولاء لوطننا الغالي من خلال الفخر بهذه الدولة العظيمة</p>`)}${rev(`<div class="question">طبقي هذه العبارة على درسنا لهذا اليوم وهو امارة الدرعية</div>`)}</div>${photo('image32.webp')}</div></div>`
];
const names=['مقدمة العرض','ميثاق الحصة','مفاتيح المعرفة','إمارة الدرعية','جدول التعلم','اضاءة','تفكير','مانع المريدي','مدينة الدرعية','مشاهدة الفيديو','التسلسل التاريخي','المخطط الزمني','التقويم الختامي','درع الوطن','الرؤية2030'];
const qs=['ماذا لو لم يستوطن الاخيضريون منطقة حجر اليمامة ؟','كيف كان تأثير  سياسية الاخيضريون في المنطقة ؟','من المسؤول عن عودة الحياة الى منطقة حجر اليمامة ؟','عندما أسس النبي محمد صلى الله عليه وسلم الدولة الإسلامية كان اول الاعمال التي قام بها هو تأسيس .......................','لماذا انتقل مانع المريدي الى نجد عام 850هـ؟'];
let current=0,revealCount=0,shieldMode='brief',shieldTarget=0,targetsDone=new Set(),soundEnabled=true,shieldOutcome='';const el=document.getElementById('stage'),count=document.getElementById('counter'),progress=document.getElementById('progress');
function play(id){if(!soundEnabled)return;const a=document.getElementById(id);if(!a)return;a.pause();a.currentTime=0;a.play().catch(()=>{});}
function tick(f=650){if(!soundEnabled)return;try{const ctx=tick.ctx||(tick.ctx=new(window.AudioContext||window.webkitAudioContext)());if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(f,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(f*.73,ctx.currentTime+.11);g.gain.setValueAtTime(.035,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.13);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.13)}catch(e){}}
function render(){document.querySelectorAll('video').forEach(v=>v.pause());el.innerHTML=screen[current]();el.setAttribute('data-slide',String(current));if(current===13){bindShield()}const reveals=el.querySelectorAll('.reveal');reveals.forEach((r,i)=>{if(i<revealCount)r.classList.add('show')});count.textContent=`${current+1} / ${screen.length} · ${names[current]}`;progress.style.width=`${(current+1)/screen.length*100}%`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===screen.length-1;document.getElementById('hint').textContent=reveals.length>revealCount?'المس الشاشة للظهور التدريجي':' ';}
function revealNext(){const v=el.querySelectorAll('.reveal');if(revealCount<v.length){v[revealCount++].classList.add('show');tick();document.getElementById('hint').textContent=revealCount===v.length?' ':'المس الشاشة للظهور التدريجي';return true}return false}
function nav(dir){if(current===13 && shieldMode==='question' && dir>0)return;if(dir>0&&revealNext())return;current=Math.max(0,Math.min(screen.length-1,current+dir));revealCount=0;render()}
el.addEventListener('click',e=>{if(e.target.closest('button,a,video,dialog,input,textarea,[contenteditable]'))return;revealNext()});document.getElementById('next').addEventListener('click',()=>nav(1));document.getElementById('prev').addEventListener('click',()=>nav(-1));document.getElementById('sound').addEventListener('click',()=>{soundEnabled=!soundEnabled;document.getElementById('sound').classList.toggle('active',!soundEnabled);document.getElementById('sound').textContent=soundEnabled?'♫':'⊘';if(!soundEnabled)document.querySelectorAll('audio').forEach(a=>a.pause())});document.getElementById('full').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.getElementById('app').requestFullscreen?.().catch(()=>{})});document.addEventListener('keydown',e=>{if(['ArrowLeft','PageDown'].includes(e.key))nav(1);if(['ArrowRight','PageUp'].includes(e.key))nav(-1);if(e.key===' '&&e.target===document.body){e.preventDefault();revealNext()}});
function shieldAsset(name){return 'assets/'+name}
function renderShield(){let t=`<div class="slide shield"><div class="shieldscene ${shieldMode}"><div class="sky"></div><img class="city" src="${shieldAsset('shield-city.webp')}" alt=""><div class="shieldhud"><span class="shieldbadge">درع الوطن · مهمة الاعتراض الذكي</span><span class="shieldbadge">${targetsDone.size} / 5</span></div>`;
 if(shieldMode==='brief'){t+=`<img class="soldier" src="${shieldAsset('shield-soldier.webp')}" alt=""><div class="shieldpanel"><h2>درع الوطن</h2><p>أبنائي وبناتي…أنتم اليوم في مهمة وطنية خاصة…تم رصد تحركات في سماء المدينة…ونحتاج إلى ذكائكم للتصدي لها<br>هل أنتم مستعدون؟</p><button class="cta alt" data-shield="start">ابدئي المهمة</button></div>`}
 if(shieldMode==='targets'){t+=`<div class="targetsheadline">مهمة الاعتراض الذكي</div>`;const c=['الأول','الثاني','الثالث','الرابع','الخامس'];for(let i=0;i<5;i++){t+=`<button class="target-btn p${i+1} ${targetsDone.has(i)?'done':''}" data-shield="pick" data-target="${i}"><img src="${shieldAsset('shield-aircraft.webp')}" alt=""><b>الهدف ${c[i]}</b></button>`}if(targetsDone.size===5){t+=`<button class="cta alt shield-screen-btn" data-shield="finish">للإنهاء</button>`}}
 if(shieldMode==='question'){t+=`<div class="shieldquestion"><h2>السؤال ${['الأول','الثاني','الثالث','الرابع','الخامس'][shieldTarget]}</h2><p>${qs[shieldTarget]}</p><div class="shieldaction"><button class="cta" data-shield="correct">إجابة صحيحة</button><button class="cta outline" data-shield="wrong">إجابة خاطئة</button></div></div><img id="rocket" class="rocket" src="${shieldAsset('shield-missile.webp')}" alt=""><img id="boom" class="boom" src="${shieldAsset('shield-hit.webp')}" alt="">`;
 if(shieldOutcome){t+=`<div class="shieldoutcome ${shieldOutcome==='good'?'shieldgood':'shieldbad'}"><h2>${shieldOutcome==='good'?'إصابة مباشرة':'الهدف لازال نشطًا'}</h2><p>${shieldOutcome==='good'?'تم اسقاط الهدف بنجاح':'لنحاول مرة أخرى نحن قريبون من الهدف'}</p><button class="cta alt" data-shield="return">${shieldOutcome==='good'?'عودة':'حاولي مرة أخرى'}</button></div>`}}
 if(shieldMode==='finish'){t+=`<div class="shieldpanel" style="left:50%;transform:translate(-50%,-50%);width:min(83%,880px);text-align:center"><h2>المهمة اكتملت بنجاح</h2><p>آداء مميز ☺</p><p>أثبتم أن المعرفة هي خط الدفاع الأول , وكل إجابة صحيحة كانت حماية وكل محاولة كانت خطوة نحو الاتقان , نفخر بكم</p><button class="cta alt" data-shield="reset">إعادة المهمة</button></div>`}
 return t+'</div></div>'}
function bindShield(){el.querySelectorAll('[data-shield]').forEach(b=>b.addEventListener('click',()=>handleShield(b.dataset.shield,Number(b.dataset.target))))}
function updateShield(){el.innerHTML=renderShield();bindShield()}
function handleShield(action,i){if(action==='start'){shieldMode='targets';targetsDone.clear();shieldOutcome='';play('brief-audio');updateShield()}else if(action==='pick'){if(targetsDone.has(i))return;shieldTarget=i;shieldOutcome='';shieldMode='question';tick(340);updateShield()}else if(action==='correct'){if(shieldOutcome)return;shieldOutcome='good';play('hit-audio');const rocket=document.getElementById('rocket');rocket.classList.add('fire');setTimeout(()=>document.getElementById('boom')?.classList.add('hit'),700);setTimeout(()=>{targetsDone.add(shieldTarget);updateShield()},1280)}else if(action==='wrong'){if(shieldOutcome)return;shieldOutcome='bad';play('miss-audio');updateShield()}else if(action==='return'){shieldOutcome='';shieldMode=targetsDone.has(shieldTarget)?'targets':'question';updateShield()}else if(action==='finish'){shieldMode='finish';tick(850);updateShield()}else if(action==='reset'){shieldMode='brief';targetsDone.clear();shieldOutcome='';updateShield()}}
render();
</script></body></html>
